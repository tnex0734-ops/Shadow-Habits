kind = "web"
previewPath = "/"
title = "ShadowHabits"
version = "1.0.0"
id = "artifacts/shadow-habits"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23467

[services.development]
run = "pnpm --filter @workspace/shadow-habits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shadow-habits", "run", "build" ]
publicDir = "artifacts/shadow-habits/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23467"
BASE_PATH = "/"
