<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2030"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- Body — broad, muscular build -->
  <rect x="17" y="35" width="30" height="23" rx="4" fill="#0D1018"/>
  <!-- Neck -->
  <rect x="28" y="32" width="8" height="6" fill="#1E2530"/>
  <!-- Head — angular, strong jaw -->
  <ellipse cx="32" cy="24" rx="11" ry="12" fill="#1E2530"/>
  <!-- Messy dark hair -->
  <path d="M21 20 Q21 9 32 8 Q43 9 43 20" fill="#080C14"/>
  <path d="M21 18 Q19 10 22 7" stroke="#080C14" stroke-width="3" fill="none"/>
  <path d="M36 9 Q40 6 42 12" stroke="#080C14" stroke-width="2.5" fill="none"/>
  <!-- Eyes — cold, calculating -->
  <ellipse cx="27" cy="24" rx="2.5" ry="2" fill="#475569" filter="url(#glow)"/>
  <ellipse cx="37" cy="24" rx="2.5" ry="2" fill="#475569" filter="url(#glow)"/>
  <!-- Scar on left lip -->
  <path d="M28 30 Q30 31 32 30" stroke="#475569" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M30 29 L30 31" stroke="#94A3B8" stroke-width="0.7" opacity="0.7"/>
  <!-- Chain weapon hint -->
  <path d="M44 38 Q52 30 56 22" stroke="#475569" stroke-width="1" fill="none" stroke-dasharray="2 2" opacity="0.4"/>
  <circle cx="56" cy="21" r="3" fill="none" stroke="#475569" stroke-width="1" opacity="0.4"/>
</svg>
