<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0D0830"/>
      <stop offset="100%" stop-color="#040210"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- Body - massive muscular build -->
  <rect x="14" y="34" width="36" height="24" rx="5" fill="#0D1035"/>
  <!-- Chest definition -->
  <ellipse cx="24" cy="42" rx="7" ry="5" fill="#111440" opacity="0.8"/>
  <ellipse cx="40" cy="42" rx="7" ry="5" fill="#111440" opacity="0.8"/>
  <!-- Head - large, confident -->
  <ellipse cx="32" cy="26" rx="12" ry="13" fill="#1E1845"/>
  <!-- Wild spiky hair -->
  <path d="M20 20 Q18 8 25 7 Q32 5 39 7 Q46 8 44 20" fill="#0A0820"/>
  <path d="M20 18 Q16 10 19 6" stroke="#0A0820" stroke-width="3" fill="none"/>
  <path d="M44 18 Q48 10 45 6" stroke="#0A0820" stroke-width="3" fill="none"/>
  <path d="M27 8 Q28 3 32 4 Q36 3 37 8" stroke="#0A0820" stroke-width="2" fill="none"/>
  <!-- Eyes - intense, enthusiastic -->
  <ellipse cx="27" cy="27" rx="2.8" ry="2.5" fill="#6366F1" filter="url(#glow)"/>
  <ellipse cx="37" cy="27" rx="2.8" ry="2.5" fill="#6366F1" filter="url(#glow)"/>
  <!-- Big grin -->
  <path d="M26 32 Q32 37 38 32" stroke="#6366F1" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.8"/>
  <path d="M26 32 Q32 37 38 32" stroke="white" stroke-width="0.5" fill="none" opacity="0.5"/>
  <!-- Boogie Woogie clap hands hint -->
  <path d="M8 40 Q10 35 14 38" stroke="#6366F1" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M56 40 Q54 35 50 38" stroke="#6366F1" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- BFF question mark -->
  <text x="32" y="13" text-anchor="middle" font-size="8" fill="#6366F1" opacity="0.5" filter="url(#glow)" font-weight="bold">?</text>
</svg>
