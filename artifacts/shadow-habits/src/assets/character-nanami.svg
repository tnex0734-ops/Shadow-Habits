<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A2800"/>
      <stop offset="100%" stop-color="#0C0800"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- Body - broad shoulders, suit -->
  <rect x="18" y="35" width="28" height="22" rx="4" fill="#1E1600"/>
  <!-- Suit lapels -->
  <path d="M27 35 L30 46 L32 43 L34 46 L37 35" fill="#2A1E00"/>
  <!-- Tie -->
  <path d="M31 35 L32 43 L33 35" fill="#D97706" opacity="0.8"/>
  <!-- Head - angular, mature -->
  <ellipse cx="32" cy="26" rx="10" ry="11" fill="#3D2E10"/>
  <!-- Short slicked back hair -->
  <path d="M22 22 Q22 12 32 11 Q42 12 42 22" fill="#1A1200"/>
  <!-- Glasses -->
  <rect x="22" y="25" width="8" height="5" rx="1" fill="none" stroke="#D97706" stroke-width="1" opacity="0.9"/>
  <rect x="34" y="25" width="8" height="5" rx="1" fill="none" stroke="#D97706" stroke-width="1" opacity="0.9"/>
  <line x1="30" y1="27.5" x2="34" y2="27.5" stroke="#D97706" stroke-width="1" opacity="0.9"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="26" cy="27.5" rx="1.8" ry="1.5" fill="#D97706" opacity="0.6"/>
  <ellipse cx="38" cy="27.5" rx="1.8" ry="1.5" fill="#D97706" opacity="0.6"/>
  <!-- 7:3 ratio text -->
  <text x="32" y="13" text-anchor="middle" font-size="5.5" fill="#D97706" opacity="0.9" filter="url(#glow)" font-family="monospace" font-weight="bold">7:3</text>
  <!-- Watch/bracelet detail -->
  <rect x="18" y="42" width="4" height="2.5" rx="1" fill="#D97706" opacity="0.5"/>
  <!-- Cleaver weapon hint -->
  <line x1="52" y1="30" x2="52" y2="55" stroke="#D97706" stroke-width="1.5" opacity="0.3"/>
  <rect x="49" y="28" width="6" height="8" rx="1" fill="#D97706" opacity="0.2"/>
</svg>
